name: Build Module Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create clean release ZIP
        env:
          BX_RELEASE_SIGNING_KEY: ${{ secrets.BX_RELEASE_SIGNING_KEY }}
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must use the vMAJOR.MINOR.PATCH format" >&2
            exit 1
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          SRC_DIR="$(jq -er '.srcDir | strings | select(length > 0)' moduleinfo.json)"
          ARCHIVE_NAME="$(jq -er '.archiveName | strings | select(length > 0)' moduleinfo.json)"
          MODULE_NAME="${ARCHIVE_NAME##*/}"
          RELEASE_ASSET="${MODULE_NAME}-${VERSION}.zip"

          test -d "$SRC_DIR"
          mkdir -p dist
          PACKAGE_DIR="$(mktemp -d)"
          git archive "HEAD:$SRC_DIR" | tar -x -C "$PACKAGE_DIR"
          python3 - "$PACKAGE_DIR" "$MODULE_NAME" "$VERSION" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          module_name = sys.argv[2]
          version = sys.argv[3]

          files = {}
          for path in sorted(root.rglob("*")):
              if not path.is_file():
                  continue
              rel = path.relative_to(root).as_posix()
              if rel in (".bx-module-manifest.json", ".bx-module-manifest.sig"):
                  continue
              if "BxGithubModuleUpdater.php" in rel:
                  continue
              files[rel] = hashlib.sha256(path.read_bytes()).hexdigest()

          manifest = {
              "module": module_name,
              "version": version,
              "files": files,
          }
          manifest_json = json.dumps(manifest, ensure_ascii=False, sort_keys=True)
          manifest_path = root / ".bx-module-manifest.json"
          manifest_path.write_text(manifest_json, encoding="utf-8")
          PY
          php -r '
            $encoded = (string) getenv("BX_RELEASE_SIGNING_KEY");
            $key = base64_decode($encoded, true);
            if (!is_string($key) || strlen($key) !== 64) {
                fwrite(STDERR, "BX_RELEASE_SIGNING_KEY must contain a base64-encoded 64-byte Ed25519 secret key.\n");
                exit(1);
            }
            $manifest = file_get_contents($argv[1]);
            if (!is_string($manifest)) {
                fwrite(STDERR, "Manifest could not be read.\n");
                exit(1);
            }
            $signature = sodium_crypto_sign_detached($manifest, $key);
            file_put_contents($argv[2], base64_encode($signature) . PHP_EOL, LOCK_EX);
          ' "$PACKAGE_DIR/.bx-module-manifest.json" "$PACKAGE_DIR/.bx-module-manifest.sig"
          (cd "$PACKAGE_DIR" && zip -qr "$GITHUB_WORKSPACE/dist/$RELEASE_ASSET" .)
          sha256sum "dist/$RELEASE_ASSET" > "dist/$RELEASE_ASSET.sha256"

          echo "RELEASE_ASSET=$RELEASE_ASSET" >> "$GITHUB_ENV"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ env.RELEASE_ASSET }}
            dist/${{ env.RELEASE_ASSET }}.sha256
          generate_release_notes: true
